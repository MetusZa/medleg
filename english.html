<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TomEDU - English</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    color: white;
    min-height: 100vh;

    background:
        radial-gradient(circle at 20% 20%, rgba(0,255,255,.12), transparent 30%),
        radial-gradient(circle at 80% 30%, rgba(255,0,255,.12), transparent 30%),
        #05050b;
}

.top {
    padding: 25px 20px;
    text-align: center;
}

.logo {
    font-size: 34px;
    font-weight: 900;
    background: linear-gradient(90deg,#00ffff,#7c4dff,#ff00ff);
    -webkit-background-clip: text;
    color: transparent;
}

.back {
    display: inline-block;
    margin-top: 15px;
    color: #aaa;
    text-decoration: none;
}

.container {
    max-width: 700px;
    margin: auto;
    padding: 20px;
}

.card {
    background: rgba(255,255,255,.05);
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 25px;
    padding: 30px 20px;
    box-shadow: 0 0 30px rgba(0,255,255,.08);
}

h1 {
    text-align: center;
}

.lesson {
    text-align: center;
    color: #aaa;
}

.word {
    text-align: center;
    margin: 30px 0;
}

.english-word {
    font-size: 48px;
    font-weight: bold;
}

.translation {
    font-size: 24px;
    color: #00ffff;
    margin-top: 10px;
}

.question {
    margin-top: 30px;
    font-size: 21px;
    text-align: center;
}

.answers {
    display: grid;
    gap: 12px;
    margin-top: 20px;
}

.answer {
    padding: 16px;
    border-radius: 15px;
    border: 1px solid rgba(255,255,255,.12);
    background: rgba(255,255,255,.05);
    color: white;
    font-size: 17px;
    cursor: pointer;
}

.answer:hover {
    border-color: #00ffff;
    box-shadow: 0 0 15px rgba(0,255,255,.25);
}

.xp {
    text-align: center;
    margin-top: 25px;
    color: #ffd700;
    font-weight: bold;
}

.result {
    display: none;
    text-align: center;
}

.next {
    margin-top: 20px;
    padding: 14px 30px;
    border: none;
    border-radius: 14px;
    background: linear-gradient(90deg,#0066ff,#9d00ff,#ff00cc);
    color: white;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

.message {
    text-align: center;
    margin-top: 15px;
    min-height: 25px;
}
</style>
</head>

<body>

<div class="top">

    <div class="logo">
        🎓 TomEDU
    </div>

    <a class="back" href="index.html">
        ← Нүүр хуудас
    </a>

</div>


<div class="container">

<div class="card">

    <h1>🇬🇧 Англи хэл</h1>

    <div class="lesson">
        Level 1 • Анхан шат
    </div>


    <div id="quiz">

        <div class="word">

            <div class="english-word" id="word">
                Cat 🐱
            </div>

            <div class="translation" id="translation">
                Муур
            </div>

        </div>


        <div class="question" id="question">
            “Муур” гэдгийг англиар юу гэдэг вэ?
        </div>


        <div class="answers" id="answers">

        </div>


        <div class="message" id="message"></div>

        <div class="xp">
            ⭐ XP: <span id="xp">0</span>
        </div>

    </div>


    <div class="result" id="result">

        <h2>🏆 Level Complete!</h2>

        <p id="score"></p>

        <p>
            ⭐ Нийт XP:
            <strong id="finalXP"></strong>
        </p>

        <p>
            🏅 Шинэ Medal:
            <strong>English Beginner</strong>
        </p>

        <button class="next" onclick="location.reload()">
            🔄 Дахин тоглох
        </button>

    </div>

</div>

</div>


<script>

const questions = [

{
    word: "Cat 🐱",
    translation: "Муур",
    question: "“Муур” гэдгийг англиар юу гэдэг вэ?",
    answers: ["Dog", "Cat", "Bird", "Fish"],
    correct: "Cat"
},

{
    word: "Dog 🐶",
    translation: "Нохой",
    question: "“Нохой” гэдгийг англиар юу гэдэг вэ?",
    answers: ["Dog", "Cat", "Horse", "Bird"],
    correct: "Dog"
},

{
    word: "Red 🔴",
    translation: "Улаан",
    question: "“Улаан” гэдгийг англиар юу гэдэг вэ?",
    answers: ["Blue", "Green", "Red", "Black"],
    correct: "Red"
},

{
    word: "Book 📖",
    translation: "Ном",
    question: "“Ном” гэдгийг англиар юу гэдэг вэ?",
    answers: ["Pen", "Book", "Bag", "Desk"],
    correct: "Book"
},

{
    word: "Apple 🍎",
    translation: "Алим",
    question: "“Алим” гэдгийг англиар юу гэдэг вэ?",
    answers: ["Orange", "Apple", "Banana", "Grape"],
    correct: "Apple"
}

];


let current = 0;
let xp = 0;
let score = 0;


function showQuestion() {

    const q = questions[current];

    document.getElementById("word").innerText = q.word;

    document.getElementById("translation").innerText =
        q.translation;

    document.getElementById("question").innerText =
        q.question;

    const answers =
        document.getElementById("answers");

    answers.innerHTML = "";

    document.getElementById("message").innerText = "";


    q.answers.forEach(answer => {

        const button =
            document.createElement("button");

        button.className = "answer";

        button.innerText = answer;

        button.onclick = () =>
            checkAnswer(answer);

        answers.appendChild(button);

    });

}


function checkAnswer(answer) {

    const q = questions[current];

    const message =
        document.getElementById("message");

    if(answer === q.correct) {

        xp += 50;
        score++;

        message.innerText =
            "🎉 Зөв! +50 XP";

    } else {

        message.innerText =
            "❌ Буруу. Зөв хариулт: " + q.correct;

    }

    document.getElementById("xp").innerText = xp;

    document
        .querySelectorAll(".answer")
        .forEach(button => {
            button.disabled = true;
        });


    setTimeout(() => {

        current++;

        if(current < questions.length) {

            showQuestion();

        } else {

            finishQuiz();

        }

    }, 1000);

}


function finishQuiz() {

    document.getElementById("quiz")
        .style.display = "none";

    document.getElementById("result")
        .style.display = "block";

    document.getElementById("score")
        .innerText =
        score + " / " + questions.length + " зөв";

    document.getElementById("finalXP")
        .innerText = xp;

}


showQuestion();

</script>

</body>
</html>
