<!DOCTYPE html>
<html lang="mn">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TomEDU English</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    color:white;
    min-height:100vh;

    background:
    radial-gradient(circle at 20% 20%,rgba(0,255,255,.12),transparent 30%),
    radial-gradient(circle at 80% 30%,rgba(255,0,255,.12),transparent 30%),
    #05050b;

    overflow-x:hidden;
}


/* =========================
   HEADER
========================= */

.top{
    padding:25px 20px 20px;
    text-align:center;
}

.logo{
    font-size:35px;
    font-weight:900;

    background:
    linear-gradient(
        90deg,
        #00ffff,
        #7c4dff,
        #ff00ff
    );

    -webkit-background-clip:text;
    color:transparent;

    text-shadow:
    0 0 20px rgba(0,255,255,.4);
}

.back{
    display:inline-block;
    margin-top:10px;
    color:#aaa;
    text-decoration:none;
}


/* =========================
   XP
========================= */

.xp-box{

    position:fixed;

    top:15px;
    right:15px;

    z-index:1000;

    padding:10px 16px;

    border-radius:15px;

    background:rgba(0,0,0,.7);

    border:
    1px solid rgba(255,255,255,.15);

    box-shadow:
    0 0 20px rgba(255,215,0,.2);

    font-weight:bold;

    color:#ffd700;

    transition:.2s;
}


/* XP +50 */

.xp-add{

    position:fixed;

    top:58px;
    right:22px;

    z-index:2000;

    color:#ffd700;

    font-size:24px;

    font-weight:900;

    opacity:0;

    pointer-events:none;

    text-shadow:
    0 0 5px #ffd700,
    0 0 15px #ffd700,
    0 0 30px rgba(255,215,0,.8);

    transform:
    translateY(0)
    scale(.7);
}


/* XP animation */

.xp-gain-animation{

    animation:
    xpGain
    1s
    cubic-bezier(.2,.8,.2,1)
    forwards;

}


@keyframes xpGain{

    0%{
        opacity:0;

        transform:
        translateY(15px)
        scale(.6);
    }

    20%{
        opacity:1;

        transform:
        translateY(0)
        scale(1.25);
    }

    45%{

        transform:
        translateY(-8px)
        scale(1.1);

    }

    100%{

        opacity:0;

        transform:
        translateY(-55px)
        scale(1);

    }

}


/* XP box glow */

.xp-glow{

    animation:
    xpBoxGlow
    .7s
    ease;

}


@keyframes xpBoxGlow{

    0%{
        transform:scale(1);

        box-shadow:
        0 0 0 rgba(255,215,0,0);
    }

    40%{

        transform:scale(1.12);

        box-shadow:
        0 0 10px #ffd700,
        0 0 30px #ffd700,
        0 0 50px rgba(255,215,0,.6);

    }

    100%{

        transform:scale(1);

        box-shadow:
        0 0 20px rgba(255,215,0,.2);

    }

}


/* =========================
   CONTAINER
========================= */

.container{

    max-width:700px;

    margin:auto;

    padding:20px;

}


/* =========================
   CARD
========================= */

.card{

    background:
    rgba(255,255,255,.05);

    border:
    1px solid rgba(255,255,255,.12);

    border-radius:25px;

    padding:30px 20px;

    box-shadow:
    0 0 30px rgba(0,255,255,.08);

}


/* =========================
   TITLES
========================= */

h1{

    text-align:center;

}

.subtitle{

    text-align:center;

    color:#999;

}


/* =========================
   MENU
========================= */

.menu{

    display:grid;

    gap:15px;

    margin-top:30px;

}

.menu-button{

    padding:18px;

    border-radius:17px;

    border:
    1px solid rgba(255,255,255,.12);

    background:
    rgba(255,255,255,.05);

    color:white;

    font-size:17px;

    cursor:pointer;

    transition:
    .2s;

}

.menu-button:hover{

    transform:
    translateY(-3px);

    border-color:
    #00ffff;

    box-shadow:
    0 0 20px
    rgba(0,255,255,.25);

}


/* difficulty */

.easy{
    border-color:#00ff88;
}

.normal{
    border-color:#00ccff;
}

.medium{
    border-color:#ffd000;
}

.hard{
    border-color:#ff7b00;
}

.extreme{
    border-color:#ff1744;
}


/* =========================
   QUIZ
========================= */

.question-number{

    text-align:center;

    color:#00ffff;

    margin-bottom:20px;

}

.question{

    text-align:center;

    font-size:25px;

    font-weight:bold;

    margin:30px 0;

}


.answers{

    display:grid;

    gap:12px;

}


.answer{

    padding:17px;

    border-radius:15px;

    border:
    1px solid
    rgba(255,255,255,.12);

    background:
    rgba(255,255,255,.05);

    color:white;

    font-size:18px;

    cursor:pointer;

    transition:.2s;

}

.answer:active{

    transform:
    scale(.97);

}


.answer.correct{

    background:
    rgba(0,255,120,.15);

    border-color:
    #00ff88;

    box-shadow:
    0 0 25px
    rgba(0,255,120,.4);

}


.answer.wrong{

    background:
    rgba(255,0,60,.15);

    border-color:
    #ff1744;

}


/* correct feedback */

.correct-feedback{

    animation:
    correctShake
    .45s
    ease;

}


@keyframes correctShake{

    0%{
        transform:scale(1);
    }

    30%{
        transform:
        scale(1.04)
        translateX(-3px);
    }

    60%{
        transform:
        scale(1.06)
        translateX(3px);
    }

    100%{
        transform:scale(1);
    }

}


/* wrong feedback */

.wrong-feedback{

    animation:
    wrongShake
    .45s
    ease;

}


@keyframes wrongShake{

    0%,100%{
        transform:
        translateX(0);
    }

    20%{
        transform:
        translateX(-8px);
    }

    40%{
        transform:
        translateX(8px);
    }

    60%{
        transform:
        translateX(-6px);
    }

    80%{
        transform:
        translateX(6px);
    }

}


/* =========================
   PRAISE
========================= */

.message{

    text-align:center;

    margin-top:25px;

    min-height:50px;

    font-size:25px;

    font-weight:900;

}


.praise-effect{

    animation:
    praisePop
    .8s
    cubic-bezier(.2,1.5,.4,1)
    forwards;

    text-shadow:
    0 0 5px currentColor,
    0 0 15px currentColor,
    0 0 30px currentColor;

}


@keyframes praisePop{

    0%{

        opacity:0;

        transform:
        scale(.4)
        rotate(-8deg);

    }

    25%{

        opacity:1;

        transform:
        scale(1.25)
        rotate(5deg);

    }

    45%{

        transform:
        scale(.95)
        rotate(-3deg);

    }

    65%{

        transform:
        scale(1.08)
        rotate(2deg);

    }

    100%{

        opacity:1;

        transform:
        scale(1)
        rotate(0);

    }

}


/* =========================
   NEXT BUTTON
========================= */

.next{

    display:none;

    margin:
    20px auto 0;

    padding:
    15px 30px;

    border:none;

    border-radius:15px;

    background:
    linear-gradient(
        90deg,
        #0066ff,
        #9d00ff,
        #ff00cc
    );

    color:white;

    font-size:17px;

    font-weight:bold;

    cursor:pointer;

}


/* =========================
   SWIPE
========================= */

.swipe-hint{

    text-align:center;

    color:#777;

    margin-top:20px;

    font-size:14px;

}


/* =========================
   RESULT
========================= */

.result{

    display:none;

    text-align:center;

}

.medal{

    font-size:70px;

}

</style>

</head>


<body>

<script>


/* =========================
QUESTIONS
========================= */

const questionBank={


easy:[

{
q:"Муур",
a:["Dog","Cat","Fish","Bird"],
c:"Cat"
},

{
q:"Нохой",
a:["Dog","Horse","Cat","Fish"],
c:"Dog"
},

{
q:"Улаан",
a:["Blue","Green","Red","Black"],
c:"Red"
},

{
q:"Ном",
a:["Pen","Book","Bag","Desk"],
c:"Book"
},

{
q:"Алим",
a:["Orange","Apple","Banana","Grape"],
c:"Apple"
},

{
q:"Сургууль",
a:["Home","School","Shop","Park"],
c:"School"
},

{
q:"Найз",
a:["Teacher","Brother","Friend","Student"],
c:"Friend"
},

{
q:"Ус",
a:["Milk","Juice","Water","Tea"],
c:"Water"
},

{
q:"Багш",
a:["Teacher","Doctor","Driver","Farmer"],
c:"Teacher"
},

{
q:"Нар",
a:["Moon","Star","Sun","Cloud"],
c:"Sun"
}

],


normal:[

{
q:"Гэр бүл",
a:["Family","Friend","School","House"],
c:"Family"
},

{
q:"Өглөө",
a:["Night","Morning","Evening","Afternoon"],
c:"Morning"
},

{
q:"Аз жаргалтай",
a:["Sad","Angry","Happy","Tired"],
c:"Happy"
},

{
q:"Том",
a:["Small","Short","Big","Thin"],
c:"Big"
},

{
q:"Унших",
a:["Write","Read","Run","Sleep"],
c:"Read"
},

{
q:"Гүйх",
a:["Walk","Run","Sit","Eat"],
c:"Run"
},

{
q:"Хүйтэн",
a:["Hot","Cold","Warm","Dry"],
c:"Cold"
},

{
q:"Хурдан",
a:["Slow","Fast","Weak","Small"],
c:"Fast"
},

{
q:"Унтах",
a:["Sleep","Wake","Jump","Play"],
c:"Sleep"
},

{
q:"Цэцэг",
a:["Tree","Flower","Grass","Leaf"],
c:"Flower"
}

],


medium:[

{
q:"Би өдөр бүр сургуульдаа явдаг.",
a:[
"I go to school every day.",
"I went to school yesterday.",
"I am sleeping.",
"I like school."
],
c:"I go to school every day."
},

{
q:"Тэр ном уншиж байна.",
a:[
"He is reading a book.",
"He reads books.",
"He is writing.",
"He went home."
],
c:"He is reading a book."
},

{
q:"Би өчигдөр кино үзсэн.",
a:[
"I watch a movie.",
"I watched a movie yesterday.",
"I am watching TV.",
"I like movies."
],
c:"I watched a movie yesterday."
},

{
q:"Тэр маш өндөр.",
a:[
"He is very tall.",
"He is very short.",
"He runs fast.",
"He is young."
],
c:"He is very tall."
},

{
q:"Би англи хэл сурч байна.",
a:[
"I learn English.",
"I am learning English.",
"I learned English.",
"I speak English."
],
c:"I am learning English."
}

],


hard:[

{
q:"Choose the correct sentence.",
a:[
"She don't like apples.",
"She doesn't like apples.",
"She doesn't likes apples.",
"She not like apples."
],
c:"She doesn't like apples."
},

{
q:"Choose the correct form.",
a:[
"I have lived here for five years.",
"I live here since five years.",
"I am live here five years.",
"I lived here for five years ago."
],
c:"I have lived here for five years."
},

{
q:"Which word is closest to “rapid”?",
a:[
"Slow",
"Fast",
"Quiet",
"Small"
],
c:"Fast"
},

{
q:"Choose the correct sentence.",
a:[
"If I were you, I would study.",
"If I am you, I would study.",
"If I was you, I study.",
"If I be you, I would study."
],
c:"If I were you, I would study."
},

{
q:"Choose the correct word: “She has ___ her homework.”",
a:[
"do",
"did",
"done",
"doing"
],
c:"done"
}

],


extreme:[

{
q:"Choose the grammatically correct sentence.",
a:[
"Had I known, I would have acted differently.",
"Had I knew, I would acted differently.",
"If I had knew, I would have act.",
"If I know, I would have acted."
],
c:"Had I known, I would have acted differently."
},

{
q:"Which word best means “ambiguous”?",
a:[
"Clear",
"Having more than one possible meaning",
"Extremely simple",
"Completely false"
],
c:"Having more than one possible meaning"
},

{
q:"Choose the correct sentence.",
a:[
"Not only did he win, but he also broke the record.",
"Not only he won, but also broke the record.",
"Not only did he won, but he broke the record.",
"Not only he did win, but he also broke."
],
c:"Not only did he win, but he also broke the record."
},

{
q:"Choose the correct form.",
a:[
"She suggested that he go home.",
"She suggested that he goes home.",
"She suggested him to go home.",
"She suggested he went home."
],
c:"She suggested that he go home."
},

{
q:"What does “inevitable” mean?",
a:[
"Impossible",
"Certain to happen",
"Very unusual",
"Easy to avoid"
],
c:"Certain to happen"
}

]

};


/* =========================
VARIABLES
========================= */

let selectedClass=1;

let difficulty="";

let questions=[];

let currentQuestion=0;

let xp=0;

let score=0;

let answered=false;


/* =========================
CLASS
========================= */

function selectClass(classNumber){

    selectedClass=classNumber;

    document
    .getElementById("classScreen")
    .style.display="none";

    document
    .getElementById("difficultyScreen")
    .style.display="block";

}


/* =========================
START
========================= */

function startQuiz(level){

    difficulty=level;

    questions=[
        ...questionBank[level]
    ];

    currentQuestion=0;

    score=0;

    document
    .getElementById("difficultyScreen")
    .style.display="none";

    document
    .getElementById("quizScreen")
    .style.display="block";

    showQuestion();

}


/* =========================
QUESTION
========================= */

function showQuestion(){

    answered=false;

    const q=
    questions[currentQuestion];


    document
    .getElementById("questionNumber")
    .innerText=
    currentQuestion+1;


    document
    .getElementById("question")
    .innerText=
    "“"+q.q+"”";


    const message=
    document.getElementById("message");

    message.innerText="";

    message.className="message";


    document
    .getElementById("nextButton")
    .style.display="none";


    const answers=
    document.getElementById("answers");

    answers.innerHTML="";


    q.a.forEach(answer=>{

        const button=
        document.createElement("button");

        button.className="answer";

        button.innerText=answer;

        button.onclick=()=>{

            checkAnswer(
                button,
                answer
            );

        };

        answers.appendChild(button);

    });

}


/* =========================
CHECK
========================= */

function checkAnswer(button,answer){

    if(answered)
        return;

    answered=true;

    const q=
    questions[currentQuestion];


    document
    .querySelectorAll(".answer")
    .forEach(btn=>{

        btn.disabled=true;

        if(btn.innerText===q.c){

            btn.classList.add(
                "correct"
            );

        }

    });


    if(answer===q.c){

        score++;


        let points=50;


        if(difficulty==="easy")
            points=30;

        if(difficulty==="normal")
            points=50;

        if(difficulty==="medium")
            points=75;

        if(difficulty==="hard")
            points=100;

        if(difficulty==="extreme")
            points=150;


        xp+=points;


        button.classList.add(
            "correct-feedback"
        );


        const message=
        document.getElementById("message");


        message.className=
        "message praise-effect";


        message.innerText=
        randomPraise();


        showXP(points);


        /* small vibration */

        if(navigator.vibrate){

            navigator.vibrate(35);

        }

    }

    else{

        button.classList.add(
            "wrong-feedback"
        );


        const message=
        document.getElementById("message");


        message.className=
        "message";


        message.innerText=
        "❌ Буруу! Зөв хариулт: "
        +q.c;


        /* stronger vibration */

        if(navigator.vibrate){

            navigator.vibrate([
                60,
                40,
                60
            ]);

        }

    }


    document
    .getElementById("xp")
    .innerText=xp;


    document
    .getElementById("nextButton")
    .style.display="block";

}


/* =========================
RANDOM PRAISE
========================= */

function randomPraise(){

    const praises=[

        "🎉 ЗӨВ БАЙНА!",
        "🔥 САЙН БАЙНА!",
        "⭐ SUPER!",
        "🚀 WOW!",
        "💪 МУНДАГ!",
        "🏆 ГАЙХАЛТАЙ!",
        "✨ ЯГ ЗӨВ!",
        "👑 АВАРГА!",
        "⚡ МАШ САЙН!",
        "🎯 PERFECT!"

    ];


    return praises[
        Math.floor(
            Math.random()
            *praises.length
        )
    ];

}


/* =========================
XP
========================= */

function showXP(points){

    const element=
    document.getElementById("xpAdd");


    const xpBox=
    document.querySelector(".xp-box");


    element.innerText=
    "+"+points+" XP";


    /* restart */

    element.classList.remove(
        "xp-gain-animation"
    );

    void element.offsetWidth;

    element.classList.add(
        "xp-gain-animation"
    );


    /* glow */

    xpBox.classList.remove(
        "xp-glow"
    );

    void xpBox.offsetWidth;

    xpBox.classList.add(
        "xp-glow"
    );


    setTimeout(()=>{

        element.classList.remove(
            "xp-gain-animation"
        );

    },1000);

}


/* =========================
NEXT
========================= */

function nextQuestion(){

    currentQuestion++;


    if(
        currentQuestion<
        questions.length
    ){

        showQuestion();

    }

    else{

        finishQuiz();

    }

}


/* =========================
RESULT
========================= */

function finishQuiz(){

    document
    .getElementById("quizScreen")
    .style.display="none";


    document
    .getElementById("resultScreen")
    .style.display="block";


    document
    .getElementById("resultScore")
    .innerText=
    "🎯 "+score+
    " / "+questions.length+
    " зөв хариуллаа!";


    document
    .getElementById("resultXP")
    .innerText=xp;


    document
    .getElementById("resultClass")
    .innerText=
    selectedClass+
    "-р анги";


    document
    .getElementById("resultDifficulty")
    .innerText=
    difficulty;

}


/* =========================
SWIPE
========================= */

let touchStartX=0;

let touchEndX=0;


document.addEventListener(
"touchstart",
function(e){

    touchStartX=
    e.changedTouches[0]
    .screenX;

});


document.addEventListener(
"touchend",
function(e){

    touchEndX=
    e.changedTouches[0]
    .screenX;

    handleSwipe();

});


function handleSwipe(){

    const distance=
    touchEndX-touchStartX;


    if(
        distance<-100 &&
        answered
    ){

        nextQuestion();

    }

}

</script>
